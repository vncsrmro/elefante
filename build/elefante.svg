<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Ear Gradient -->
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Body & Head Gradient -->
    <linearGradient id="bodyGrad" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="40%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Tusk Gradient -->
    <linearGradient id="tuskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Trunk Glow / Accent -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Clip Path for Rounded Squircle Icon -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116" />
    </clipPath>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <g clip-path="url(#squircle)">
    <!-- Deep Tech Slate Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Ambient Glow in Background -->
    <circle cx="340" cy="220" r="180" fill="#6366F1" opacity="0.22" filter="url(#glow)" />
    <circle cx="180" cy="380" r="160" fill="#38BDF8" opacity="0.16" filter="url(#glow)" />

    <!-- Subtle Tech Circuit Lines in Background -->
    <path d="M 60 120 L 200 120 L 260 180" stroke="#334155" stroke-width="2.5" fill="none" opacity="0.35" stroke-dasharray="6,6" />
    <path d="M 450 380 L 370 380 L 320 330" stroke="#334155" stroke-width="2.5" fill="none" opacity="0.35" stroke-dasharray="6,6" />
    <circle cx="260" cy="180" r="4" fill="#38BDF8" opacity="0.5" />
    <circle cx="320" cy="330" r="4" fill="#6366F1" opacity="0.5" />

    <!-- ELEPHANT ARTWORK -->
    <g transform="translate(18, 12)" filter="url(#shadow)">
      
      <!-- Back Ear (Layer 1 - deepest) -->
      <path d="M 120 180 C 80 140, 50 240, 90 320 C 120 380, 190 380, 210 320 Z" 
            fill="#1E293B" opacity="0.7" />

      <!-- Massive Forehead & Temples (Layer 2) -->
      <path d="M 190 140 
               C 240 90, 340 100, 390 170 
               C 420 215, 425 280, 395 330 
               C 380 355, 360 380, 365 420 
               C 370 455, 410 475, 445 440 
               C 465 420, 475 385, 470 345 
               C 468 335, 482 330, 486 342 
               C 495 395, 478 448, 440 478 
               C 390 515, 335 480, 325 420 
               C 320 375, 345 340, 360 310 
               C 380 270, 375 220, 345 190 
               C 315 160, 260 160, 220 195 
               Z" 
            fill="url(#bodyGrad)" />

      <!-- Front Magnificent Ear (Layer 3) -->
      <path d="M 215 175 
               C 130 150, 70 230, 90 330 
               C 105 400, 175 425, 235 375 
               C 260 355, 270 320, 265 270 
               C 260 220, 250 185, 215 175 Z" 
            fill="url(#earGrad)" 
            stroke="#64748B" stroke-width="4" stroke-opacity="0.4" />

      <!-- Inner Ear Contour / Flap -->
      <path d="M 195 210 
               C 140 195, 110 255, 125 320 
               C 135 365, 180 385, 220 350 
               C 238 335, 245 305, 240 265 
               C 235 230, 220 215, 195 210 Z" 
            fill="#0F172A" opacity="0.65" />

      <!-- Sleek Glowing Energy Line along Trunk -->
      <path d="M 378 220 
               C 395 260, 385 315, 362 355 
               C 345 385, 348 420, 365 442 
               C 382 462, 412 455, 428 432" 
            fill="none" 
            stroke="url(#glowGrad)" 
            stroke-width="7" 
            stroke-linecap="round" 
            filter="url(#glow)" 
            opacity="0.9" />

      <!-- Mighty Ivory Tusk (Layer 4) -->
      <path d="M 360 330 
               C 400 345, 450 330, 480 280 
               C 485 272, 480 268, 474 274 
               C 445 305, 400 318, 355 310 
               Z" 
            fill="url(#tuskGrad)" 
            filter="url(#shadow)" />

      <!-- Tusk Base Accent -->
      <path d="M 353 308 L 362 332" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />

      <!-- Wise, Intelligent AI Eye -->
      <path d="M 315 215 C 330 205, 350 208, 362 222" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none" />
      <ellipse cx="338" cy="222" rx="15" ry="11" fill="#0F172A" transform="rotate(-5 338 222)" />
      <ellipse cx="340" cy="221" rx="9" ry="8" fill="#38BDF8" filter="url(#glow)" />
      <circle cx="341" cy="221" r="5" fill="#0284C7" />
      <circle cx="343" cy="218" r="2.8" fill="#FFFFFF" />

      <!-- Temple Crest Accents -->
      <circle cx="280" cy="155" r="3.5" fill="#38BDF8" opacity="0.8" />
      <circle cx="305" cy="145" r="4.5" fill="#818CF8" opacity="0.9" />
      <circle cx="335" cy="142" r="3.5" fill="#38BDF8" opacity="0.8" />
      <path d="M 280 155 L 305 145 L 335 142" stroke="#818CF8" stroke-width="2" fill="none" opacity="0.5" />

    </g>

    <!-- Outer Squircle Rim Bevel -->
    <rect x="2" y="2" width="508" height="508" rx="114" ry="114" 
          fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />
  </g>
</svg>